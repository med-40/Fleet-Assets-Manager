name: Test Web Application

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  web-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create database
        run: |
          python create_database.py

      - name: Check FastAPI application
        run: |
          python -c "from web.main import app; print(app.title)"

      - name: Start FastAPI server
        run: |
          python run_web.py > web_server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID"
          sleep 5

          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "FastAPI server stopped unexpectedly."
            cat web_server.log || true
            exit 1
          fi

      - name: Show server log
        if: always()
        run: |
          echo "===== FastAPI SERVER LOG ====="
          cat web_server.log || true
          echo "===== END SERVER LOG ====="

      - name: Test Web Page
        run: |
          python -c "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/'); content = response.read().decode(); assert 'نظام تسيير الحضيرة' in content; print('Web page OK')"

      - name: Test Database Endpoint
        run: |
          python -c "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health'); print(response.read().decode())"

      - name: Test Dashboard Page
        run: |
          python -c "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/dashboard'); content = response.read().decode(); assert 'لوحة التحكم' in content; print('Dashboard OK')"

      - name: Final server log
        if: failure()
        run: |
          echo "===== FINAL SERVER LOG ====="
          cat web_server.log || true
