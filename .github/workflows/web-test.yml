name: Web Application Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  web-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check FastAPI import
        run: |
          python -c "from web.main import app; print('FastAPI:', app.title)"

      - name: Create database
        run: |
          python create_database.py

      - name: Start FastAPI server
        run: |
          nohup python -m uvicorn web.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > web_server.log 2>&1 &

          echo $! > web_server.pid

      - name: Wait for FastAPI
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8000/health"

          for attempt in range(30):

              try:

                  response = urllib.request.urlopen(
                      url,
                      timeout=2
                  )

                  print("FastAPI HTTP status:", response.status)

                  body = response.read().decode("utf-8")

                  print("Health response:")
                  print(body)

                  break

              except Exception as error:

                  print(
                      f"Waiting for FastAPI... "
                      f"attempt {attempt + 1}/30"
                  )

                  print(error)

                  time.sleep(1)

          else:

              raise RuntimeError(
                  "FastAPI server did not start"
              )
          PY

      - name: Test Dashboard
        run: |
          python - <<'PY'
          import urllib.request

          url = "http://127.0.0.1:8000/dashboard"

          print("Opening:", url)

          response = urllib.request.urlopen(
              url,
              timeout=10
          )

          content = response.read().decode("utf-8")

          print("Dashboard HTTP status:")
          print(response.status)

          print("===== DASHBOARD RESPONSE =====")
          print(content)
          print("===== END DASHBOARD RESPONSE =====")

          if response.status != 200:
              raise RuntimeError(
                  "Dashboard returned an invalid HTTP status"
              )

          print("Dashboard HTTP test OK")
          PY

      - name: Test Equipment Types
        run: |
          python - <<'PY'
          import urllib.request

          url = "http://127.0.0.1:8000/equipment-types"

          print("Opening:", url)

          response = urllib.request.urlopen(
              url,
              timeout=10
          )

          content = response.read().decode("utf-8")

          print("Equipment Types HTTP status:")
          print(response.status)

          print("===== EQUIPMENT TYPES RESPONSE =====")
          print(content)
          print("===== END EQUIPMENT TYPES RESPONSE =====")

          if response.status != 200:
              raise RuntimeError(
                  "Equipment Types returned an invalid HTTP status"
              )

          print("Equipment Types HTTP test OK")
          PY

      - name: Show FastAPI log
        if: always()
        run: |
          echo "===== FASTAPI SERVER LOG ====="

          if [ -f web_server.log ]; then
              cat web_server.log
          else
              echo "web_server.log does not exist"
          fi

          echo "===== END FASTAPI SERVER LOG ====="

      - name: Stop FastAPI
        if: always()
        run: |
          if [ -f web_server.pid ]; then
              kill "$(cat web_server.pid)" || true
          fi
