name: Web Application Test

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  web-test:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Checkout
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # Python
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =====================================================
      # Dependencies
      # =====================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # =====================================================
      # Check Python syntax
      # =====================================================

      - name: Check Python syntax
        run: |

          echo "===================================="
          echo "CHECKING PYTHON SYNTAX"
          echo "===================================="

          python -m compileall -q app web

          echo "===================================="
          echo "PYTHON SYNTAX CHECK PASSED"
          echo "===================================="


      # =====================================================
      # Check FastAPI import
      # =====================================================

      - name: Check FastAPI import
        run: |

          echo "===================================="
          echo "CHECKING FASTAPI IMPORT"
          echo "===================================="

          python - <<'PY'

          import traceback

          print("Starting FastAPI import test...")

          try:

              from web.main import app

              print("")
              print("====================================")
              print("FASTAPI IMPORT: OK")
              print("====================================")

              print("Application title:")
              print(app.title)

              print("")
              print("Application version:")
              print(app.version)

          except Exception as error:

              print("")
              print("====================================")
              print("FASTAPI IMPORT ERROR")
              print("====================================")

              traceback.print_exc()

              print("")
              print("ERROR TYPE:")
              print(type(error).__name__)

              print("")
              print("ERROR MESSAGE:")
              print(str(error))

              raise

          PY
