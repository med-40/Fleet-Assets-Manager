name: Web Application Test

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  web-test:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Checkout
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # Python
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =====================================================
      # Dependencies
      # =====================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # =====================================================
      # Compile Python files
      # =====================================================

      - name: Check Python syntax
        run: |

          echo "===================================="
          echo "CHECKING PYTHON SYNTAX"
          echo "===================================="

          python -m compileall -q app web

          echo "===================================="
          echo "PYTHON SYNTAX CHECK PASSED"
          echo "===================================="


      # =====================================================
      # FastAPI import
      # =====================================================

      - name: Check FastAPI import
        run: |

          echo "===================================="
          echo "CHECKING FASTAPI IMPORT"
          echo "===================================="

          python - <<'PY'

          import traceback

          print("Starting FastAPI import test...")

          try:

              from web.main import app

              print("")
              print("====================================")
              print("FASTAPI IMPORT: OK")
              print("====================================")

              print("Application title:")
              print(app.title)

              print("")
              print("Application version:")
              print(app.version)

          except Exception as error:

              print("")
              print("====================================")
              print("FASTAPI IMPORT ERROR")
              print("====================================")

              traceback.print_exc()

              print("")
              print("====================================")
              print("ERROR TYPE")
              print("====================================")

              print(type(error).__name__)

              print("")
              print("====================================")
              print("ERROR MESSAGE")
              print("====================================")

              print(str(error))

              print("")
              print("====================================")

              raise

          PY


      # =====================================================
      # Create database
      # =====================================================

      - name: Create database
        run: |

          echo "===================================="
          echo "CREATING DATABASE"
          echo "===================================="

          python create_database.py

          echo "===================================="
          echo "DATABASE CREATION FINISHED"
          echo "===================================="


      # =====================================================
      # Start FastAPI
      # =====================================================

      - name: Start FastAPI server
        run: |

          echo "===================================="
          echo "STARTING FASTAPI SERVER"
          echo "===================================="

          nohup python -m uvicorn web.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > web_server.log 2>&1 &

          echo $! > web_server.pid

          sleep 2

          echo "FastAPI process started."


      # =====================================================
      # Wait for FastAPI
      # =====================================================

      - name: Wait for FastAPI
        run: |

          python - <<'PY'

          import time
          import urllib.request

          url = "http://127.0.0.1:8000/health"

          print("====================================")
          print("WAITING FOR FASTAPI")
          print("====================================")

          for attempt in range(30):

              try:

                  response = urllib.request.urlopen(
                      url,
                      timeout=2
                  )

                  body = response.read().decode("utf-8")

                  print("")
                  print("FastAPI HTTP status:")
                  print(response.status)

                  print("")
                  print("Health response:")
                  print(body)

                  if response.status != 200:
                      raise RuntimeError(
                          "Health endpoint returned invalid status"
                      )

                  print("")
                  print("FASTAPI STARTED SUCCESSFULLY")

                  break

              except Exception as error:

                  print(
                      f"Waiting for FastAPI... "
                      f"attempt {attempt + 1}/30"
                  )

                  print("Error:", error)

                  time.sleep(1)

          else:

              print("")
              print("====================================")
              print("FASTAPI DID NOT START")
              print("====================================")

              raise RuntimeError(
                  "FastAPI server did not start"
              )

          PY


      # =====================================================
      # Test Dashboard
      # =====================================================

      - name: Test Dashboard
        run: |

          python - <<'PY'

          import urllib.request

          url = "http://127.0.0.1:8000/dashboard"

          print("====================================")
          print("TESTING DASHBOARD")
          print("====================================")

          print("Opening:", url)

          response = urllib.request.urlopen(
              url,
              timeout=10
          )

          content = response.read().decode("utf-8")

          print("")
          print("Dashboard HTTP status:")
          print(response.status)

          print("")
          print("===== DASHBOARD RESPONSE =====")
          print(content)
          print("===== END DASHBOARD RESPONSE =====")

          if response.status != 200:

              raise RuntimeError(
                  "Dashboard returned an invalid HTTP status"
              )

          print("")
          print("Dashboard HTTP test OK")

          PY


      # =====================================================
      # Test Equipment Types
      # =====================================================

      - name: Test Equipment Types
        run: |

          python - <<'PY'

          import urllib.request
          import urllib.error

          url = "http://127.0.0.1:8000/equipment-types"

          print("====================================")
          print("TESTING EQUIPMENT TYPES")
          print("====================================")

          print("Opening:", url)

          try:

              response = urllib.request.urlopen(
                  url,
                  timeout=10
              )

              content = response.read().decode("utf-8")

              print("")
              print("Equipment Types HTTP status:")
              print(response.status)

              print("")
              print("===== EQUIPMENT TYPES RESPONSE =====")
              print(content)
              print("===== END EQUIPMENT TYPES RESPONSE =====")

              if response.status != 200:

                  raise RuntimeError(
                      "Equipment Types returned an invalid HTTP status"
                  )

              print("")
              print("Equipment Types HTTP test OK")

          except urllib.error.HTTPError as error:

              print("")
              print("====================================")
              print("EQUIPMENT TYPES HTTP ERROR")
              print("====================================")

              print("HTTP status:", error.code)

              try:

                  error_body = error.read().decode("utf-8")

                  print("")
                  print("===== ERROR RESPONSE =====")
                  print(error_body)
                  print("===== END ERROR RESPONSE =====")

              except Exception:

                  pass

              raise

          PY


      # =====================================================
      # Show FastAPI log
      # =====================================================

      - name: Show FastAPI log
        if: always()
        run: |

          echo "===================================="
          echo "===== FASTAPI SERVER LOG ====="
          echo "===================================="

          if [ -f web_server.log ]; then

              cat web_server.log

          else

              echo "web_server.log does not exist"

          fi

          echo "===================================="
          echo "===== END FASTAPI SERVER LOG ====="
          echo "===================================="


      # =====================================================
      # Stop FastAPI
      # =====================================================

      - name: Stop FastAPI
        if: always()
        run: |

          if [ -f web_server.pid ]; then

              kill "$(cat web_server.pid)" || true

          fi
      - name: Start FastAPI server
        run: |
          nohup python -m uvicorn web.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            --log-level debug \
            > web_server.log 2>&1 &

          echo $! > web_server.pid

      - name: Wait for FastAPI
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8000/health"

          for attempt in range(30):
              try:
                  response = urllib.request.urlopen(
                      url,
                      timeout=2
                  )

                  print("FastAPI HTTP status:", response.status)

                  body = response.read().decode("utf-8")

                  print("Health response:")
                  print(body)

                  break

              except Exception as error:
                  print(
                      f"Waiting for FastAPI... "
                      f"attempt {attempt + 1}/30"
                  )
                  print(error)
                  time.sleep(1)

          else:
              print("===== FASTAPI LOG =====")

              try:
                  with open(
                      "web_server.log",
                      "r",
                      encoding="utf-8"
                  ) as file:
                      print(file.read())
              except Exception as error:
                  print(error)

              raise RuntimeError(
                  "FastAPI server did not start"
              )
          PY

      - name: Test Dashboard
        run: |
          python - <<'PY'
          import urllib.request

          url = "http://127.0.0.1:8000/dashboard"

          print("Opening:", url)

          try:

              response = urllib.request.urlopen(
                  url,
                  timeout=10
              )

              content = response.read().decode("utf-8")

              print("Dashboard HTTP status:")
              print(response.status)

              print(content)

          except Exception as error:

              print("Dashboard ERROR:")
              print(error)

              print("===== FASTAPI LOG =====")

              try:
                  with open(
                      "web_server.log",
                      "r",
                      encoding="utf-8"
                  ) as file:
                      print(file.read())
              except Exception as log_error:
                  print(log_error)

              raise

      - name: Test Equipment Types
        run: |
          python - <<'PY'
          import urllib.request

          url = "http://127.0.0.1:8000/equipment-types"

          print("Opening:", url)

          try:

              response = urllib.request.urlopen(
                  url,
                  timeout=10
              )

              content = response.read().decode("utf-8")

              print("Equipment Types HTTP status:")
              print(response.status)

              print("===== EQUIPMENT TYPES RESPONSE =====")
              print(content)
              print("===== END RESPONSE =====")

          except Exception as error:

              print("Equipment Types ERROR:")
              print(error)

              print("")
              print("====================================")
              print("===== FASTAPI SERVER LOG =====")
              print("====================================")

              try:
                  with open(
                      "web_server.log",
                      "r",
                      encoding="utf-8"
                  ) as file:
                      print(file.read())
              except Exception as log_error:
                  print(log_error)

              print("====================================")
              print("===== END FASTAPI SERVER LOG =====")
              print("====================================")

              raise

      - name: Show FastAPI log
        if: always()
        run: |
          echo "===== FASTAPI SERVER LOG ====="

          if [ -f web_server.log ]; then
              cat web_server.log
          else
              echo "web_server.log does not exist"
          fi

          echo "===== END FASTAPI SERVER LOG ====="

      - name: Stop FastAPI
        if: always()
        run: |
          if [ -f web_server.pid ]; then
              kill "$(cat web_server.pid)" || true
          fi
