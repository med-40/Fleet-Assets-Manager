name: Web Application Test

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  web-test:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Checkout
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # Python
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =====================================================
      # Dependencies
      # =====================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # =====================================================
      # Check Python syntax
      # =====================================================

      - name: Check Python syntax
        run: |

          echo "===================================="
          echo "CHECKING PYTHON SYNTAX"
          echo "===================================="

          python -m compileall -q app web

          echo "===================================="
          echo "PYTHON SYNTAX CHECK PASSED"
          echo "===================================="


      # =====================================================
      # Check FastAPI import
      # =====================================================

      - name: Check FastAPI import
        run: |

          echo "===================================="
          echo "CHECKING FASTAPI IMPORT"
          echo "===================================="

          python - <<'PY'

          import traceback

          print("Starting FastAPI import test...")

          try:

              from web.main import app

              print("")
              print("====================================")
              print("FASTAPI IMPORT: OK")
              print("====================================")

              print("Application title:")
              print(app.title)

              print("")
              print("Application version:")
              print(app.version)

          except Exception as error:

              print("")
              print("====================================")
              print("FASTAPI IMPORT ERROR")
              print("====================================")

              traceback.print_exc()

              print("")
              print("ERROR TYPE:")
              print(type(error).__name__)

              print("")
              print("ERROR MESSAGE:")
              print(str(error))

              raise

          PY


      # =====================================================
      # Check Database Models
      # =====================================================

      - name: Check Database Models
        run: |

          echo "===================================="
          echo "CHECKING DATABASE MODELS"
          echo "===================================="

          python - <<'PY'

          from app.database.base import Base
          import app.database.models

          tables = set(
              Base.metadata.tables.keys()
          )

          required_tables = {
              "equipment",
              "maintenance_types",
              "maintenance_schedules",
              "maintenance_orders",
              "meter_readings",
          }

          print("Registered tables:")

          for table in sorted(tables):
              print(" -", table)

          missing = (
              required_tables - tables
          )

          if missing:

              print("")
              print("MISSING TABLES:")

              for table in sorted(missing):
                  print(" -", table)

              raise SystemExit(1)

          print("")
          print("====================================")
          print("DATABASE MODELS: OK")
          print("====================================")

          PY


      # =====================================================
      # Check Maintenance Router
      # =====================================================

      - name: Check Maintenance Router
        run: |

          echo "===================================="
          echo "CHECKING MAINTENANCE ROUTER"
          echo "===================================="

          python - <<'PY'

          import app.modules.maintenance.routes as maintenance_api
          import web.routers.maintenance as maintenance_web

          from web.main import app


          # =================================================
          # API Router
          # =================================================

          print("")
          print("MAINTENANCE API ROUTES:")

          api_paths = []

          for route in maintenance_api.router.routes:

              path = getattr(
                  route,
                  "path",
                  None,
              )

              methods = getattr(
                  route,
                  "methods",
                  None,
              )

              api_paths.append(path)

              print(
                  " -",
                  path,
                  methods,
              )


          assert any(
              path
              and path.startswith("/maintenance")
              for path in api_paths
          ), (
              "Maintenance API Router غير صحيح."
          )


          # =================================================
          # Web Router
          # =================================================

          print("")
          print("MAINTENANCE WEB ROUTES:")

          web_paths = []

          for route in maintenance_web.router.routes:

              path = getattr(
                  route,
                  "path",
                  None,
              )

              methods = getattr(
                  route,
                  "methods",
                  None,
              )

              web_paths.append(path)

              print(
                  " -",
                  path,
                  methods,
              )


          assert "/" in web_paths, (
              "Maintenance Web Router "
              "لا يحتوي على الصفحة الرئيسية."
          )


          # =================================================
          # التحقق من تسجيل Web Router
          # =================================================

          print("")
          print("FASTAPI MAINTENANCE ROUTES:")

          registered_paths = []

          for route in app.routes:

              path = getattr(
                  route,
                  "path",
                  None,
              )

              if path:
                  registered_paths.append(path)

                  if path.startswith(
                      "/maintenance"
                  ):
                      print(
                          " -",
                          path,
                          getattr(
                              route,
                              "methods",
                              None,
                          ),
                      )


          # =================================================
          # المسار الحقيقي المتوقع
          # =================================================

          assert "/maintenance/" in registered_paths, (
              "Maintenance Web Router "
              "غير مربوط بالتطبيق."
          )


          print("")
          print("====================================")
          print("MAINTENANCE ROUTER: OK")
          print("====================================")

          PY


      # =====================================================
      # Test Maintenance Due By Date
      # =====================================================

      - name: Test Maintenance Due By Date
        run: |

          echo "===================================="
          echo "TESTING MAINTENANCE DUE BY DATE"
          echo "===================================="

          python - <<'PY'

          from datetime import (
              date,
              timedelta,
          )

          from app.database.base import Base
          from app.database.session import (
              engine,
              SessionLocal,
          )

          from app.modules.maintenance.models import (
              Maintenance
