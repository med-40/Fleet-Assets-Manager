name: Web Application Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  web-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check FastAPI import
        run: |
          python -c "from web.main import app; print(app.title)"

      - name: Create database
        run: |
          python create_database.py

      - name: Start FastAPI server
        run: |
          nohup python -m uvicorn web.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > web_server.log 2>&1 &

          echo $! > web_server.pid

      - name: Wait for server
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8000/health"

          for i in range(30):
              try:
                  response = urllib.request.urlopen(url, timeout=2)
                  print("Server response:", response.status)
                  break
              except Exception:
                  print("Waiting for FastAPI...")
                  time.sleep(1)
          else:
              raise RuntimeError("FastAPI server did not start")
          PY

      - name: Test Dashboard
        run: |
          python - <<'PY'
          import urllib.request

          response = urllib.request.urlopen(
              "http://127.0.0.1:8000/dashboard"
          )

          content = response.read().decode("utf-8")

          assert "لوحة التحكم" in content

          print("Dashboard OK")
          PY

      - name: Test Equipment Types
        run: |
          python - <<'PY'
          import urllib.request

          response = urllib.request.urlopen(
              "http://127.0.0.1:8000/equipment-types"
          )

          content = response.read().decode("utf-8")

          assert "أنواع العتاد" in content

          print("Equipment Types OK")
          PY

      - name: Show server log if failed
        if: failure()
        run: |
          echo "===== FASTAPI SERVER LOG ====="

          if [ -f web_server.log ]; then
            cat web_server.log
          else
            echo "web_server.log does not exist"
          fi

          echo "===== END SERVER LOG ====="

      - name: Stop server
        if: always()
        run: |
          if [ -f web_server.pid ]; then
            kill "$(cat web_server.pid)" || true
          fi
