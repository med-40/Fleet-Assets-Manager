name: Test Web Application

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  web-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create database
        run: |
          python create_database.py

      - name: Check FastAPI application
        run: |
          python -c "from web.main import app; print(app.title)"

      - name: Start Uvicorn
        run: |
          python -m uvicorn web.main:app --host 127.0.0.1 --port 8000 > web_server.log 2>&1 &
          echo $! > server.pid
          sleep 5

      - name: Show server log
        run: |
          echo "===== FASTAPI SERVER LOG ====="
          cat web_server.log || true
          echo "===== END SERVER LOG ====="

      - name: Check server process
        run: |
          if ! kill -0 $(cat server.pid) 2>/dev/null; then
            echo "FastAPI server failed to start."
            exit 1
          fi

      - name: Test Home Page
        run: |
          python -c "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/'); content = response.read().decode(); assert 'نظام تسيير الحضيرة' in content; print('Home page OK')"

      - name: Test Health
        run: |
          python -c "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health'); print(response.read().decode())"

      - name: Test Dashboard
        run: |
          python -c "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/dashboard'); content = response.read().decode(); assert 'لوحة التحكم' in content; print('Dashboard OK')"

      - name: Final server log
        if: failure()
        run: |
          echo "===== FINAL FASTAPI SERVER LOG ====="
          cat web_server.log || true
          echo "===== END FINAL LOG ====="
