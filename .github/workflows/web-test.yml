name: Web Application Test

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  web-test:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Checkout
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # Python
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =====================================================
      # Dependencies
      # =====================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # =====================================================
      # Check Python syntax
      # =====================================================

      - name: Check Python syntax
        run: |

          echo "===================================="
          echo "CHECKING PYTHON SYNTAX"
          echo "===================================="

          python -m compileall -q app web

          echo "===================================="
          echo "PYTHON SYNTAX CHECK PASSED"
          echo "===================================="


      # =====================================================
      # Check FastAPI import
      # =====================================================

      - name: Check FastAPI import
        run: |

          echo "===================================="
          echo "CHECKING FASTAPI IMPORT"
          echo "===================================="

          python - <<'PY'

          import traceback

          print("Starting FastAPI import test...")

          try:

              from web.main import app

              print("")
              print("====================================")
              print("FASTAPI IMPORT: OK")
              print("====================================")

              print("Application title:")
              print(app.title)

              print("")
              print("Application version:")
              print(app.version)

          except Exception as error:

              print("")
              print("====================================")
              print("FASTAPI IMPORT ERROR")
              print("====================================")

              traceback.print_exc()

              print("")
              print("ERROR TYPE:")
              print(type(error).__name__)

              print("")
              print("ERROR MESSAGE:")
              print(str(error))

              raise

          PY


      # =====================================================
      # Check Database Models
      # =====================================================

      - name: Check Database Models
        run: |

          echo "===================================="
          echo "CHECKING DATABASE MODELS"
          echo "===================================="

          python - <<'PY'

          from app.database.base import Base
          import app.database.models

          tables = set(
              Base.metadata.tables.keys()
          )

          required_tables = {
              "equipment",
              "maintenance_types",
              "maintenance_schedules",
              "maintenance_orders",
              "meter_readings",
          }

          print("Registered tables:")

          for table in sorted(tables):
              print(" -", table)

          missing = (
              required_tables - tables
          )

          if missing:

              print("")
              print("MISSING TABLES:")

              for table in sorted(missing):
                  print(" -", table)

              raise SystemExit(1)

          print("")
          print("====================================")
          print("DATABASE MODELS: OK")
          print("====================================")

          PY


      # =====================================================
      # Check Maintenance Router
      # =====================================================

      - name: Check Maintenance Router
        run: |

          echo "===================================="
          echo "CHECKING MAINTENANCE ROUTER"
          echo "===================================="

          python - <<'PY'

          import app.modules.maintenance.routes as maintenance_module

          from web.main import app

          print("")
          print("ROUTES INSIDE MAINTENANCE MODULE:")

          for route in maintenance_module.router.routes:

              print(
                  " -",
                  getattr(
                      route,
                      "path",
                      None,
                  ),
                  getattr(
                      route,
                      "methods",
                      None,
                  ),
              )

          print("")
          print("ROUTES INSIDE FASTAPI APP:")

          for route in app.routes:

              print(
                  " -",
                  getattr(
                      route,
                      "path",
                      None,
                  ),
                  getattr(
                      route,
                      "methods",
                      None,
                  ),
              )

          print("")
          print("MAINTENANCE ROUTER OBJECT:")
          print(
              maintenance_module.router
          )

          print("")
          print("APP ROUTER INCLUDE CHECK:")

          included = any(
              getattr(
                  route,
                  "path",
                  ""
              ).startswith(
                  "/maintenance"
              )
              for route in app.routes
              if getattr(
                  route,
                  "path",
                  None
              )
          )

          print(included)

          assert included, (
              "Maintenance Web Router "
              "غير مربوط بالتطبيق."
          )

          print("")
          print("====================================")
          print("MAINTENANCE ROUTER: OK")
          print("====================================")

          PY


      # =====================================================
      # Test Maintenance Due By Date
      # =====================================================

      - name: Test Maintenance Due By Date
        run: |

          echo "===================================="
          echo "TESTING MAINTENANCE DUE BY DATE"
          echo "===================================="

          python - <<'PY'

          from datetime import (
              date,
              timedelta,
          )

          from app.database.base import Base
          from app.database.session import (
              engine,
              SessionLocal,
          )

          from app.modules.maintenance.models import (
              MaintenanceSchedule,
          )

          from app.modules.maintenance.service import (
              get_due_schedules,
          )


          Base.metadata.create_all(
              bind=engine
          )

          db = SessionLocal()

          try:

              schedule = MaintenanceSchedule(
                  equipment_id=999999,
                  name="اختبار صيانة دورية",
                  interval_days=30,
                  next_due_date=(
                      date.today()
                      - timedelta(days=1)
                  ),
              )

              db.add(schedule)
              db.commit()
              db.refresh(schedule)

              due = get_due_schedules(
                  db=db,
                  today=date.today(),
              )

              assert any(
                  item.id == schedule.id
                  for item in due
              ), (
                  "لم يتم اكتشاف خطة "
                  "الصيانة كمستحقة بالتاريخ."
              )

              print("")
              print("====================================")
              print("MAINTENANCE DUE BY DATE: OK")
              print("====================================")

          finally:

              db.close()

          PY


      # =====================================================
      # Test Maintenance Due By Meter
      # =====================================================

      - name: Test Maintenance Due By Meter
        run: |

          echo "===================================="
          echo "TESTING MAINTENANCE DUE BY METER"
          echo "===================================="

          python - <<'PY'

          from datetime import date

          from app.database.base import Base
          from app.database.session import (
              engine,
              SessionLocal,
          )

          from app.modules.maintenance.models import (
              MaintenanceSchedule,
              MeterReading,
          )

          from app.modules.maintenance.service import (
              get_due_schedules,
          )


          Base.metadata.create_all(
              bind=engine
          )

          db = SessionLocal()

          try:

              reading = MeterReading(
                  equipment_id=888888,
                  reading_value=120000,
                  reading_date=date.today(),
              )

              db.add(reading)

              schedule = MaintenanceSchedule(
                  equipment_id=888888,
                  name="اختبار صيانة حسب العداد",
                  interval_km=10000,
                  next_due_meter=120000,
              )

              db.add(schedule)

              db.commit()
              db.refresh(schedule)

              due = get_due_schedules(
                  db=db,
                  today=date.today(),
              )

              assert any(
                  item.id == schedule.id
                  for item in due
              ), (
                  "لم يتم اكتشاف الصيانة "
                  "المستحقة بالعداد."
              )

              print("")
              print("====================================")
              print("MAINTENANCE DUE BY METER: OK")
              print("====================================")

          finally:

              db.close()

          PY


      # =====================================================
      # Test Maintenance Completion Cycle
      # =====================================================

      - name: Test Maintenance Completion Cycle
        run: |

          echo "===================================="
          echo "TESTING MAINTENANCE COMPLETION CYCLE"
          echo "===================================="

          python - <<'PY'

          from datetime import (
              date,
              timedelta,
          )

          from app.database.base import Base
          from app.database.session import (
              engine,
              SessionLocal,
          )

          from app.modules.maintenance.models import (
              MaintenanceOrder,
              MaintenanceSchedule,
              MeterReading,
          )

          from app.modules.maintenance.service import (
              complete_maintenance_order,
          )


          Base.metadata.create_all(
              bind=engine
          )

          db = SessionLocal()

          try:

              # =============================================
              # إنشاء خطة الصيانة
              # =============================================

              schedule = MaintenanceSchedule(
                  equipment_id=777777,
                  name="اختبار دورة الصيانة",
                  interval_km=10000,
                  interval_days=30,
              )

              db.add(schedule)
              db.commit()
              db.refresh(schedule)


              # =============================================
              # إنشاء أمر صيانة
              # =============================================

              order = MaintenanceOrder(
                  equipment_id=777777,
                  maintenance_schedule_id=schedule.id,
                  maintenance_type="اختبار",
                  maintenance_date=date.today(),
                  status="جارية",
              )

              db.add(order)
              db.commit()
              db.refresh(order)


              # =============================================
              # إتمام الصيانة
              # =============================================

              completed = (
                  complete_maintenance_order(
                      db=db,
                      order_id=order.id,
                      completion_date=date.today(),
                      meter_reading=120000,
                  )
              )


              # =============================================
              # التحقق من الإتمام
              # =============================================

              assert (
                  completed.status
                  == "منتهية"
              )

              assert (
                  completed.completion_date
                  == date.today()
              )

              assert (
                  completed.meter_reading
                  == 120000
              )


              # =============================================
              # تحديث خطة الصيانة
              # =============================================

              db.refresh(schedule)

              assert (
                  schedule.last_maintenance_date
                  == date.today()
              )

              assert (
                  schedule.last_maintenance_meter
                  == 120000
              )

              assert (
                  schedule.next_due_meter
                  == 130000
              )

              assert (
                  schedule.next_due_date
                  == (
                      date.today()
                      + timedelta(days=30)
                  )
              )


              # =============================================
              # التحقق من حفظ قراءة العداد
              # =============================================

              reading = (
                  db.query(MeterReading)
                  .filter(
                      MeterReading.equipment_id
                      == 777777,
                      MeterReading.reading_value
                      == 120000,
                  )
                  .first()
              )

              assert reading is not None


              print("")
              print("====================================")
              print(
                  "MAINTENANCE COMPLETION CYCLE: OK"
              )
              print("====================================")

          finally:

              db.close()

          PY
