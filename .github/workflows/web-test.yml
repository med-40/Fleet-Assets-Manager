name: Test Web Application

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  web-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check FastAPI application
        run: |
          python -c "from web.main import app; print(app.title)"

      - name: Start FastAPI server
        run: |
          nohup python run_web.py > web_server.log 2>&1 &
          sleep 5

      - name: Test Web Page
        run: |
          python -c "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/'); content = response.read().decode(); assert 'نظام تسيير الحضيرة' in content; print('Web page OK')"

      - name: Test Database Endpoint
        run: |
          python -c "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health'); print(response.read().decode())"

      - name: Show server log if needed
        if: failure()
        run: |
          cat web_server.log
