<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
    {% block title %}
    نظام تسيير الحضيرة
    {% endblock %}
</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #222;
    }

    .app {
        display: flex;
        min-height: 100vh;
    }

    /* =========================
       القائمة الجانبية
       ========================= */

    .sidebar {
        width: 240px;
        background: #ffffff;
        border-left: 1px solid #ddd;
        padding: 20px 15px;
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        overflow-y: auto;
    }

    .logo {
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        color: #198754;
        padding: 15px 5px 25px;
        border-bottom: 1px solid #eee;
        margin-bottom: 15px;
    }

    .menu {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .menu a {
        display: block;
        text-decoration: none;
        color: #333;
        padding: 12px 15px;
        border-radius: 7px;
        font-size: 15px;
        transition: 0.2s;
    }

    .menu a:hover {
        background: #e8f5ee;
        color: #198754;
    }

    .menu a.active {
        background: #198754;
        color: white;
        font-weight: bold;
    }

    /* =========================
       المحتوى الرئيسي
       ========================= */

    .content {
        flex: 1;
        margin-right: 240px;
        min-height: 100vh;
    }

    /* =========================
       الشريط العلوي
       ========================= */

    .topbar {
        background: white;
        padding: 15px 25px;
        border-bottom: 1px solid #ddd;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .topbar h1 {
        margin: 0;
        font-size: 20px;
    }

    /* =========================
       منطقة الصفحة
       ========================= */

    .page {
        padding: 25px;
    }

    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 25px;
    }

    .page-header h2 {
        margin: 0;
        font-size: 24px;
    }

    /* =========================
       البطاقات
       ========================= */

    .card {
        background: white;
        border-radius: 10px;
        padding: 20px;
        border: 1px solid #e1e5e8;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    /* =========================
       الأزرار
       ========================= */

    .btn {
        display: inline-block;
        border: none;
        border-radius: 7px;
        padding: 10px 16px;
        text-decoration: none;
        cursor: pointer;
        font-size: 14px;
    }

    .btn-primary {
        background: #198754;
        color: white;
    }

    .btn-primary:hover {
        background: #157347;
    }

    .btn-secondary {
        background: #6c757d;
        color: white;
    }

    .btn-danger {
        background: #dc3545;
        color: white;
    }

    /* =========================
       الجداول
       ========================= */

    .table-container {
        width: 100%;
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
    }

    th,
    td {
        padding: 12px;
        border-bottom: 1px solid #eee;
        text-align: right;
    }

    th {
        background: #f8f9fa;
        font-weight: bold;
    }

    tr:hover td {
        background: #fafafa;
    }

    /* =========================
       النماذج
       ========================= */

    .form-group {
        margin-bottom: 16px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
    }

    .form-control {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ced4da;
        border-radius: 7px;
        font-size: 14px;
        background: white;
    }

    .form-control:focus {
        outline: none;
        border-color: #198754;
    }

    /* =========================
       شبكة البطاقات
       ========================= */

    .grid {
        display: grid;
        grid-template-columns: repeat(
            auto-fit,
            minmax(220px, 1fr)
        );
        gap: 18px;
    }

    /* =========================
       الحالات
       ========================= */

    .status {
        display: inline-block;
        padding: 5px 9px;
        border-radius: 15px;
        font-size: 12px;
        font-weight: bold;
    }

    .status-success {
        background: #d1e7dd;
        color: #0f5132;
    }

    .status-warning {
        background: #fff3cd;
        color: #664d03;
    }

    .status-danger {
        background: #f8d7da;
        color: #842029;
    }

    .status-secondary {
        background: #e2e3e5;
        color: #41464b;
    }

    /* =========================
       الهاتف
       ========================= */

    @media (max-width: 768px) {

        .sidebar {
            width: 200px;
        }

        .content {
            margin-right: 200px;
        }

        .page {
            padding: 15px;
        }

        .topbar {
            padding: 12px 15px;
        }

        .page-header {
            flex-direction: column;
            align-items: flex-start;
        }
    }

</style>

{% block head %}
{% endblock %}

</head><body><div class="app"><!-- =========================
     القائمة الجانبية
     ========================= -->

<aside class="sidebar">

    <div class="logo">
        Fleet Assets Manager
    </div>

    <nav class="menu">

        <a href="/">
            لوحة التحكم
        </a>

        <a href="/equipment">
            العتاد
        </a>

        <a href="/drivers">
            السائقون
        </a>

        <a href="/maintenance">
            الصيانة
        </a>

        <a href="/missions">
            المهمات
        </a>

        <a href="/workshops">
            الورشات
        </a>

    </nav>

</aside>


<!-- =========================
     المحتوى
     ========================= -->

<main class="content">

    <header class="topbar">

        <h1>
            {% block page_title %}
            نظام تسيير الحضيرة
            {% endblock %}
        </h1>

    </header>

    <section class="page">

        {% block content %}
        {% endblock %}

    </section>

</main>

</div>{% block scripts %}
{% endblock %}

</body></html>
