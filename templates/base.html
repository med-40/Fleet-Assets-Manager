<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        نظام تسيير الحضيرة
        {% endblock %}
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }


        /* =========================
           القائمة الجانبية
           ========================= */

        .sidebar {
            width: 240px;

            background: #ffffff;

            border-left: 1px solid #ddd;

            padding: 20px 15px;

            position: fixed;

            right: 0;
            top: 0;
            bottom: 0;

            overflow-y: auto;
        }


        .logo {
            text-align: center;

            font-size: 20px;

            font-weight: bold;

            color: #198754;

            padding: 15px 5px 25px;

            border-bottom: 1px solid #eee;

            margin-bottom: 15px;
        }


        .menu {
            display: flex;

            flex-direction: column;

            gap: 6px;
        }


        .menu a {
            display: block;

            text-decoration: none;

            color: #333;

            padding: 12px 15px;

            border-radius: 7px;

            font-size: 15px;

            transition: 0.2s;
        }


        .menu a:hover {
            background: #e8f5ee;

            color: #198754;
        }


        .menu a.active {
            background: #198754;

            color: white;

            font-weight: bold;
        }


        /* =========================
           المحتوى الرئيسي
           ========================= */

        .content {
            flex: 1;

            margin-right: 240px;

            min-height: 100vh;
        }
