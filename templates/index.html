<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام تسيير الحضيرة</title>

    <style>

            margin: 0;

            background: #f5f6f8;
            color: #222;
        }

        .header {
            background: #ffffff;
            padding: 20px 30px;
            border-bottom: 1px solid #ddd;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .container {
            padding: 30px;
        }

        .welcome {

        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #e8f5e9;
        }

</head>

<body>

    <header class="header">
        <h1>نظام تسيير الحضيرة</h1>
    </header>

    <main class="container">

        <section class="welcome">

            <h2>مرحبًا بك</h2>

            <p>
                نظام تسيير الحضيرة يعمل حاليًا عبر Web Application.
            </p>

            <div class="status">
                الخادم يعمل بنجاح.
            </div>

        </section>

    </main>

</body>

</html>
