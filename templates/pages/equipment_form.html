{% extends "base.html" %}

{% block title %}
إضافة عتاد - نظام تسيير الحضيرة
{% endblock %}

{% block content %}

<style>

    .form-header {
        margin-bottom: 25px;
    }

    .form-header h1 {
        margin: 0;
        font-size: 30px;
    }

    .form-header p {
        color: #666;
    }

    .form-card {
        background: white;
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 25px;
        max-width: 900px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
    }

    .field {
        display: flex;
        flex-direction: column;
        gap: 7px;
    }

    .field label {
        font-weight: bold;
    }

    .field input,
    .field select,
    .field textarea {
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
        background: white;
        font-family: Arial, sans-serif;
    }

    .field textarea {
        min-height: 100px;
        resize: vertical;
    }

    .full-width {
        grid-column: 1 / -1;
    }

    .buttons {
        margin-top: 25px;
        display: flex;
        gap: 10px;
    }

    .button {
        padding: 11px 22px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        text-decoration: none;
        font-size: 15px;
    }

    .save {
        background: #198754;
        color: white;
    }

    .save:hover {
        background: #157347;
    }

    .cancel {
        background: #eeeeee;
        color: #333;
    }

    .error {
        background: #ffe5e5;
        color: #a00;
        padding: 12px;
        border-radius: 7px;
        margin-bottom: 20px;
    }

    @media (max-width: 700px) {

        .form-grid {
            grid-template-columns: 1fr;
        }

        .full-width {
            grid-column: auto;
        }

    }

</style>


<div class="form-header">

    <h1>
        إضافة عتاد
    </h1>

    <p>
        إدخال عتاد جديد إلى قاعدة البيانات
    </p>

</div>


<div class="form-card">

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form method="post" action="/equipment/new">

        <div class="form-grid">


            <!-- 1. وثيقة الاستلام -->

            <div class="field">

                <label for="receipt_document">
                    وثيقة الاستلام *
                </label>

                <input
                    id="receipt_document"
                    type="text"
                    name="receipt_document"
                    required
                    maxlength="100"
                    placeholder="رقم أو مرجع وثيقة الاستلام"
                >

            </div>


            <!-- 2. نوع العتاد -->

            <div class="field">

                <label for="equipment_type_id">
                    نوع العتاد *
                </label>

                <select
                    id="equipment_type_id"
                    name="equipment_type_id"
                    required
                >

                    <option value="">
                        اختر نوع العتاد
                    </option>

                    {% for equipment_type in equipment_types %}

                        <option
                            value="{{ equipment_type.id }}"
                        >
                            {{ equipment_type.name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- 3. الطراز -->

            <div class="field">

                <label for="model">
                    الطراز
                </label>

                <input
                    id="model"
                    type="text"
                    name="model"
                    maxlength="100"
                >

            </div>


            <!-- 4. رقم التسجيل -->

            <div class="field">

                <label for="registration_number">
                    رقم التسجيل *
                </label>

                <input
                    id="registration_number"
                    type="text"
                    name="registration_number"
                    required
                    maxlength="100"
                >

            </div>


            <!-- 5. رقم الهيكل -->

            <div class="field">

                <label for="chassis_number">
                    رقم الهيكل
                </label>

                <input
                    id="chassis_number"
                    type="text"
                    name="chassis_number"
                    maxlength="150"
                >

            </div>


            <!-- 6. الحالة -->

            <div class="field">

                <label for="status">
                    الحالة
                </label>

                <select
                    id="status"
                    name="status"
                >

                    <option value="متاحة">
                        متاحة
                    </option>

                    <option value="في مهمة">
                        في مهمة
                    </option>

                    <option value="في الورشة">
                        في الورشة
                    </option>

                    <option value="متوقفة">
                        متوقفة
                    </option>

                    <option value="خارج الخدمة">
                        خارج الخدمة
                    </option>

                </select>

            </div>


            <!-- 7. المصلحة -->

            <div class="field">

                <label for="department">
                    المصلحة
                </label>

                <input
                    id="department"
                    type="text"
                    name="department"
                    maxlength="150"
                >

            </div>


            <!-- 8. نوع الوقود -->

            <div class="field">

                <label for="fuel_type">
                    نوع الوقود
                </label>

                <select
                    id="fuel_type"
                    name="fuel_type"
                >

                    <option value="">
                        اختر نوع الوقود
                    </option>

                    <option value="مازوت">
                        مازوت
                    </option>

                    <option value="بنزين">
                        بنزين
                    </option>

                    <option value="غاز">
                        غاز
                    </option>

                    <option value="كهرباء">
                        كهرباء
                    </option>

                    <option value="هجين">
                        هجين
                    </option>

                </select>

            </div>


            <!-- 9. معدل الاستهلاك -->

            <div class="field">

                <label for="fuel_consumption">
                    معدل الاستهلاك
                </label>

                <input
                    id="fuel_consumption"
                    type="text"
                    name="fuel_consumption"
                    placeholder="مثال: 8.5"
                >

            </div>


            <!-- 10. الملاحظات -->

            <div class="field full-width">

                <label for="notes">
                    الملاحظات
                </label>

                <textarea
                    id="notes"
                    name="notes"
                    maxlength="500"
                    placeholder="ملاحظات إضافية..."
                ></textarea>

            </div>


        </div>


        <div class="buttons">

            <button
                type="submit"
                class="button save"
            >
                حفظ العتاد
            </button>


            <a
                href="/equipment"
                class="button cancel"
            >
                إلغاء
            </a>

        </div>

    </form>

</div>

{% endblock %}
