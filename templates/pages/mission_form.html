{% extends "base.html" %}

{% block title %}
إضافة مهمة - نظام تسيير الحضيرة
{% endblock %}

{% block content %}

<style>

    .page-header {
        margin-bottom: 25px;
    }

    .page-header h1 {
        margin: 0;
        font-size: 30px;
    }

    .page-header p {
        margin: 8px 0 0;
        color: #666;
    }

    .form-container {
        max-width: 850px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 25px;
        margin: 0 auto;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .form-group.full {
        grid-column: 1 / -1;
    }

    label {
        margin-bottom: 7px;
        font-weight: bold;
    }

    input,
    select,
    textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 11px 12px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
        background: white;
    }

    textarea {
        min-height: 100px;
        resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: none;
        border-color: #198754;
        box-shadow: 0 0 0 2px rgba(25, 135, 84, 0.12);
    }

    .help-text {
        margin-top: 5px;
        font-size: 12px;
        color: #777;
    }

    .error {
        background: #f8d7da;
        color: #842029;
        border: 1px solid #f1aeb5;
        border-radius: 7px;
        padding: 12px;
        margin-bottom: 20px;
    }

    .driver-preview {
        margin-top: 7px;
        padding: 8px 10px;
        background: #d1e7dd;
        color: #0f5132;
        border-radius: 6px;
        font-size: 13px;
        display: none;
    }

    .button-row {
        display: flex;
        justify-content: flex-start;
        gap: 10px;
        margin-top: 25px;
    }

    .save-button {
        border: none;
        padding: 12px 25px;
        background: #198754;
        color: white;
        border-radius: 7px;
        font-weight: bold;
        cursor: pointer;
        font-size: 15px;
    }

    .save-button:hover {
        background: #157347;
    }

    .cancel-button {
        display: inline-block;
        padding: 12px 25px;
        background: #6c757d;
        color: white;
        text-decoration: none;
        border-radius: 7px;
        font-weight: bold;
    }

    .cancel-button:hover {
        background: #5c636a;
    }

    @media (max-width: 700px) {

        .form-grid {
            grid-template-columns: 1fr;
        }

        .form-group.full {
            grid-column: auto;
        }

        .form-container {
            padding: 18px;
        }

    }

</style>


<div class="page-header">

    <h1>
        إضافة مهمة
    </h1>

    <p>
        تسجيل مهمة جديدة للعتاد
    </p>

</div>


<div class="form-container">

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form
        method="post"
        action="/missions/new"
    >

        <div class="form-grid">


            <!-- السيارة / العتاد -->

            <div class="form-group full">

                <label for="equipment_id">
                    السيارة / العتاد
                </label>

                <select
                    id="equipment_id"
                    name="equipment_id"
                    required
                >

                    <option value="">
                        -- اختر السيارة / العتاد --
                    </option>

                    {% for equipment in equipment_list %}

                        <option
                            value="{{ equipment.id }}"
                        >

                            {{ equipment.registration_number }}

                            {% if equipment.model %}
                                — {{ equipment.model }}
                            {% endif %}

                        </option>

                    {% endfor %}

                </select>

                <div class="help-text">
                    ستظهر هنا السيارات التي يسمح النظام بإسنادها إلى مهمة.
                </div>

            </div>


            <!-- السائق -->
