{% extends "base.html" %}

{% block title %}
إضافة نوع عتاد - نظام تسيير الحضيرة
{% endblock %}

{% block content %}

<style>

    .form-header {
        margin-bottom: 25px;
    }

    .form-header h1 {
        margin: 0;
        font-size: 30px;
    }

    .form-header p {
        color: #666;
        margin-top: 8px;
    }

    .form-card {
        background: white;
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 25px;
        max-width: 700px;
    }

    .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 20px;
    }

    .field label {
        font-weight: bold;
    }

    .field input,
    .field textarea {
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
        font-family: Arial, sans-serif;
    }

    .field textarea {
        min-height: 120px;
        resize: vertical;
    }

    .buttons {
        margin-top: 25px;
        display: flex;
        gap: 10px;
    }

    .button {
        padding: 11px 22px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        text-decoration: none;
        font-size: 15px;
    }

    .save {
        background: #198754;
        color: white;
    }

    .save:hover {
        background: #157347;
    }

    .cancel {
        background: #eeeeee;
        color: #333;
    }

    .error {
        background: #f8d7da;
        color: #842029;
        padding: 12px 15px;
        border-radius: 7px;
        margin-bottom: 20px;
    }

</style>


<div class="form-header">

    <h1>
        إضافة نوع عتاد
    </h1>

    <p>
        إضافة تصنيف جديد للسيارات والعتاد
    </p>

</div>


<div class="form-card">

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form
        method="post"
        action="/equipment-types/new"
    >


        <div class="field">

            <label for="name">
                اسم نوع العتاد *
            </label>

            <input
                id="name"
                type="text"
                name="name"
                required
                maxlength="100"
                placeholder="مثال: سيارة، حافلة، شاحنة..."
            >

        </div>


        <div class="field">

            <label for="description">
                الوصف
            </label>

            <textarea
                id="description"
                name="description"
                maxlength="300"
                placeholder="وصف اختياري لنوع العتاد"
            ></textarea>

        </div>


        <div class="buttons">

            <button
                type="submit"
                class="button save"
            >
                حفظ النوع
            </button>


            <a
                href="/equipment-types"
                class="button cancel"
            >
                إلغاء
            </a>

        </div>


    </form>

</div>

{% endblock %}
